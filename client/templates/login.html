<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Controle de Acesso Sala AAA</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="brand-badge">PROJETO AAA · NDA</span>
        <h1 style="font-size: 1.4rem; margin-top: 0.65rem;">Controle de Acesso & Segurança</h1>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
          Sala Restrita de Design de Personagens
        </p>
      </div>

      <div id="login-erro" style="display: none; background: var(--danger-bg); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); padding: 0.65rem 0.85rem; border-radius: 8px; font-size: 0.86rem; margin-bottom: 1rem;"></div>

      <form id="form-login">
        <div class="form-group">
          <label for="usuario">Usuário Administrador</label>
          <input type="text" id="usuario" name="usuario" placeholder="admin" value="admin" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="•••••" value="admin" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Entrar no Painel
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("form-login");
    const boxErro = document.getElementById("login-erro");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      boxErro.style.display = "none";
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha }),
        });
        if (res.ok) {
          window.location.href = "/monitor";
        } else {
          const data = await res.json().catch(() => ({}));
          boxErro.textContent = data.erro || "Usuário ou senha inválidos.";
          boxErro.style.display = "block";
        }
      } catch (err) {
        boxErro.textContent = "Falha de comunicação com o servidor.";
        boxErro.style.display = "block";
      }
    });
  </script>
</body>
</html>
